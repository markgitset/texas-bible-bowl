# Canonical host is the apex (texasbiblebowl.org) — matches the URLs search engines
# already index. Fly's proxy terminates TLS and forwards HTTP here with Host preserved;
# force_https in fly.toml handles the http→https upgrade at the edge.

# www (or any future non-canonical alias) → apex, preserving the path.
server {
    listen 80;
    server_name www.texasbiblebowl.org;
    return 301 https://texasbiblebowl.org$request_uri;
}

# Everything else (the apex, plus the app's *.fly.dev hostname for smoke tests).
server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # HSTS: tell browsers to reach this host over https only, so a later http:// link can't
    # be intercepted before the edge redirects it. Deliberately conservative to start:
    #   * max-age is 1 day — a bad rollout ages out fast. Ramp to 31536000 (1 year) after a
    #     few stable weeks.
    #   * NO includeSubDomains — that would cover every *.texasbiblebowl.org name, and any
    #     subdomain without working TLS would become unreachable in browsers that saw this
    #     header. Only add it after auditing the zone.
    #   * NO preload — that ships the domain in browser binaries and is painful to undo.
    # Browsers ignore this over plain http, so it costs nothing on the fly.dev smoke-test host.
    add_header Strict-Transport-Security "max-age=86400" always;

    # Hugo renders 404.html at the site root.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
