# Canonical host is the apex (texasbiblebowl.org) — matches the URLs search engines
# already index. Fly's proxy terminates TLS and forwards HTTP here with Host preserved;
# force_https in fly.toml handles the http→https upgrade at the edge.

# www (or any future non-canonical alias) → apex, preserving the path.
server {
    listen 80;
    server_name www.texasbiblebowl.org;
    return 301 https://texasbiblebowl.org$request_uri;
}

# Everything else (the apex, plus the app's *.fly.dev hostname for smoke tests).
server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hugo renders 404.html at the site root.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
