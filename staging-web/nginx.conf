# The app script and stylesheet are requested as tbb.js?v=<build> / custom.css?v=<build> (see
# app-shell.html / baseof.html): the URL changes with every deploy, so a versioned copy can be
# cached for good with no revalidation. Unversioned requests get no header, as before.
map "$uri?$arg_v" $versioned_cache {
    default "";
    "~^/(app/tbb\.js|css/custom\.css)\?.+$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Staging must never appear in search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Empty for everything but the versioned assets above; nginx omits an empty header.
    add_header Cache-Control $versioned_cache;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hugo renders 404.html at the site root (same page GitHub Pages serves).
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
