<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {{/* This layout bypasses baseof.html, so it needs its own light-canvas declaration — a stub
       flashing dark on a dark OS theme defeats the site-wide fix (see baseof.html). */}}
  <meta name="color-scheme" content="light">
  <style>html{color-scheme:light;background-color:#fff}</style>
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  {{ $target := .Params.redirect | absURL }}
  <meta http-equiv="refresh" content="0; url={{ $target }}">
  <link rel="canonical" href="{{ $target }}">
  <meta name="robots" content="noindex">
</head>
<body>
  <p>This page has moved to <a href="{{ $target }}">{{ $target }}</a>.</p>
</body>
</html>
