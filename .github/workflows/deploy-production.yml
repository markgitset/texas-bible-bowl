name: Deploy to production

# Manual promotion: Actions → "Deploy to production" → Run workflow (from main), then
# approve the `production` gate ONCE — that one click covers the whole run. Deploys BOTH
# halves from one commit — the backend to the prod Fly app and the Hugo site + web app to
# the static Fly app texas-bible-bowl-web (merges to main deploy staging only, never prod).
# Promote a commit that staging has already run — by default, main's HEAD.
# Each successful deploy is tagged prod-YYYYMMDD-HHMM, so `git tag -l 'prod-*'` is the
# deploy history and the latest tag is what's live.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA / ref to deploy (default: main's HEAD)"
        required: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    # The single approval gate for the whole promotion, plus the backend Fly token. This is
    # the ONLY job naming a reviewer-protected environment — see the note on `frontend`.
    # Both prod environments are restricted to the `main` branch, so a promotion can only be
    # dispatched from main; the `ref` input still picks which commit it deploys.
    environment: production
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Server tests
        run: ./gradlew :server:test

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BACKEND_DEPLOY_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Backend health check
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://texas-bible-bowl.fly.dev/health

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    # Deliberately a DIFFERENT environment from the backend's. GitHub evaluates approval
    # gates per gated job, not per run, so naming `production` here would demand a SECOND
    # "Review deployments" click mid-promotion. `production-web` has no required reviewers,
    # so one click covers the run — the gate still fronts this job, which `needs: backend`
    # and cannot start before that approval.
    #
    # It exists as its own environment (rather than moving the token to a repo-level secret)
    # to keep FLY_WEB_DEPLOY_TOKEN scoped: this repo is PUBLIC and has no repo-level secrets,
    # and that token can publish arbitrary content to texasbiblebowl.org. Like `production`,
    # it is restricted to the `main` branch.
    environment: production-web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.backend.outputs.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and deploy the static frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WEB_DEPLOY_TOKEN }}
          # Baked into the app shell as window.TBB_BACKEND_URL and used for the season-params
          # bake. The repo variable is https://api.texasbiblebowl.org since the 2026-08-08
          # cutover; the fly.dev fallback only applies if the variable is ever unset.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://texas-bible-bowl.fly.dev' }}
        run: tools/deploy-web.sh prod

      - name: Frontend health check
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 -o /dev/null -w "texas-bible-bowl-web: %{http_code}\n" https://texas-bible-bowl-web.fly.dev/

  tag:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.backend.outputs.sha }}

      - name: Tag the deployed commit
        run: |
          tag="prod-$(date -u +%Y%m%d-%H%M)"
          git tag "$tag" "${{ needs.backend.outputs.sha }}"
          git push origin "$tag"
          echo "Tagged ${{ needs.backend.outputs.sha }} as $tag" >> "$GITHUB_STEP_SUMMARY"
