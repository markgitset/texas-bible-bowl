name: Deploy to production

# Manual promotion: Actions → "Deploy to production" → Run workflow, then approve the
# `production` environment gate. Deploys BOTH halves from one commit — the backend to the
# prod Fly app and the Hugo site + web app to the static Fly app texas-bible-bowl-web
# (merges to main deploy staging only, never prod).
# Promote a commit that staging has already run — by default, main's HEAD.
# Each successful deploy is tagged prod-YYYYMMDD-HHMM, so `git tag -l 'prod-*'` is the
# deploy history and the latest tag is what's live.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA / ref to deploy (default: main's HEAD)"
        required: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    # The approval gate + prod Fly token live on this environment. NOTE: the `frontend`
    # job names the same environment, so a promotion currently asks for TWO approvals
    # (see the TODO there) — one per gated job, not one per run.
    environment: production
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Server tests
        run: ./gradlew :server:test

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BACKEND_DEPLOY_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Backend health check
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://texas-bible-bowl.fly.dev/health

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    # TODO (Mark, 2026-08-08): ONE approval should cover a whole promotion. GitHub gates
    # per gated job, not per run, so naming `production` here forces a second "Review
    # deployments" click after the backend job finishes. This job only names the
    # environment to reach FLY_WEB_DEPLOY_TOKEN. Fix: move that token to a repo-level
    # secret and drop this `environment:` line — the backend job's gate still fronts the
    # run, since this job `needs` it and nothing here can start before that approval.
    # Trade-off: the frontend deploy stops appearing under the production environment in
    # the Environments UI (the backend deploy and the prod-* tag still record each ship).
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.backend.outputs.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and deploy the static frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WEB_DEPLOY_TOKEN }}
          # Baked into the app shell as window.TBB_BACKEND_URL and used for the season-params
          # bake; the repo variable flips to https://api.texasbiblebowl.org at the DNS cutover.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://texas-bible-bowl.fly.dev' }}
        run: tools/deploy-web.sh prod

      - name: Frontend health check
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 -o /dev/null -w "texas-bible-bowl-web: %{http_code}\n" https://texas-bible-bowl-web.fly.dev/

  tag:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.backend.outputs.sha }}

      - name: Tag the deployed commit
        run: |
          tag="prod-$(date -u +%Y%m%d-%H%M)"
          git tag "$tag" "${{ needs.backend.outputs.sha }}"
          git push origin "$tag"
          echo "Tagged ${{ needs.backend.outputs.sha }} as $tag" >> "$GITHUB_STEP_SUMMARY"
