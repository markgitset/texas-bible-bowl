name: Deploy to production

# Manual promotion: Actions → "Deploy to production" → Run workflow (from main), then
# approve the `production` gate ONCE — that one click covers the whole run. Deploys BOTH
# halves from one commit — the backend to the prod Fly app and the Hugo site + web app to
# the static Fly app texas-bible-bowl-web (merges to main deploy staging only, never prod).
# Promote a commit that staging has already run — by default, main's HEAD.
# Each successful deploy is tagged prod-YYYYMMDD-HHMM, so `git tag -l 'prod-*'` is the
# deploy history and the latest tag is what's live.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA / ref to deploy (default: main's HEAD)"
        required: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    # The single approval gate for the whole promotion, plus the backend Fly token. This is
    # the ONLY job naming a reviewer-protected environment — see the note on `frontend`.
    # Both prod environments are restricted to the `main` branch, so a promotion can only be
    # dispatched from main; the `ref` input still picks which commit it deploys.
    environment: production
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.ident.outputs.sha }}
      tag: ${{ steps.ident.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history + tags so `git describe` works (the root :writeVersionFile task).
          fetch-depth: 0

      # The deploy's identity, fixed once here and used three times: the frontend bakes it
      # into the site footer, the `tag` job applies it as an annotated tag, and both name the
      # same commit. Naming it up front is what lets the footer show the exact tag even though
      # the tag is only pushed after both halves have deployed successfully.
      - id: ident
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=prod-$(date -u +%Y%m%d-%H%M)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Server tests + build the server dist
        # installDist on the runner: server/Dockerfile just COPYs the dist (the in-image
        # Gradle build OOM'd Fly's depot builder — see the Dockerfile header).
        run: ./gradlew :server:test :server:installDist

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BACKEND_DEPLOY_TOKEN }}
          # Baked into the image and reported by GET /health (BuildVersion.kt) — the same tag
          # the frontend stamps in the footer and the `tag` job applies, so all three agree.
          TAG: ${{ steps.ident.outputs.tag }}
        # --local-only: build the (trivial, copy-only) image with the runner's Docker and
        # push it to Fly's registry. Fly's remote depot builder gets wedged and then every
        # deploy times out in "Waiting for depot builder..." (2026-08-31 promotion) — with
        # no remote builder in the path, a builder outage can't block a deploy.
        run: flyctl deploy --local-only --build-arg "TBB_VERSION=$TAG"

      - name: Backend health check
        # Also proves the deploy actually rolled: /health must report THIS promotion's version,
        # not whatever the machine was serving before.
        env:
          TAG: ${{ steps.ident.outputs.tag }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://texas-bible-bowl.fly.dev/health -o health.json
          cat health.json; echo
          jq -e --arg v "$TAG" '.version == $v' health.json > /dev/null \
            || { echo "::error::/health reports version $(jq -r .version health.json), expected $TAG"; exit 1; }

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    # Deliberately a DIFFERENT environment from the backend's. GitHub evaluates approval
    # gates per gated job, not per run, so naming `production` here would demand a SECOND
    # "Review deployments" click mid-promotion. `production-web` has no required reviewers,
    # so one click covers the run — the gate still fronts this job, which `needs: backend`
    # and cannot start before that approval.
    #
    # It exists as its own environment (rather than moving the token to a repo-level secret)
    # to keep FLY_WEB_DEPLOY_TOKEN scoped: this repo is PUBLIC and has no repo-level secrets,
    # and that token can publish arbitrary content to texasbiblebowl.org. Like `production`,
    # it is restricted to the `main` branch.
    environment: production-web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.backend.outputs.sha }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and deploy the static frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WEB_DEPLOY_TOKEN }}
          # Baked into the app shell as window.TBB_BACKEND_URL and used for the season-params
          # bake. The repo variable is https://api.texasbiblebowl.org since the 2026-08-08
          # cutover; the fly.dev fallback only applies if the variable is ever unset.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://texas-bible-bowl.fly.dev' }}
          # Overrides the git-derived version in the footer with the tag this promotion is
          # about to apply, so the deployed site reads `prod-YYYYMMDD-HHMM` and not
          # "<previous prod tag>-N-g<hash>".
          TBB_VERSION: ${{ needs.backend.outputs.tag }}
        run: tools/deploy-web.sh prod

      - name: Frontend health check
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 -o /dev/null -w "texas-bible-bowl-web: %{http_code}\n" https://texas-bible-bowl-web.fly.dev/

  tag:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.backend.outputs.sha }}

      - name: Tag the deployed commit
        # ANNOTATED (-a), not lightweight: plain `git describe` ignores lightweight tags, so
        # the pre-2026-10 prod-* tags are invisible to it and only `--tags` finds them. The
        # footer's version comes from the root :writeVersionFile task, which does count
        # lightweight tags — but annotated keeps a bare `git describe` honest too, and records
        # who deployed and when.
        #
        # An annotated tag is a real git object and needs a committer identity, which a
        # runner has none of (a lightweight tag needs none — that's the catch when switching).
        env:
          TAG: ${{ needs.backend.outputs.tag }}
          SHA: ${{ needs.backend.outputs.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production deploy of $SHA, promoted by $ACTOR" "$SHA"
          git push origin "$TAG"
          echo "Tagged $SHA as $TAG" >> "$GITHUB_STEP_SUMMARY"
