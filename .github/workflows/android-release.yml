name: Android release APK

# Builds the Android app as a release APK signed with the app's own key, so every build installs
# as an update over the last one (CI's debug APK is signed with a throwaway key per runner, so a
# newer one can only be installed after uninstalling the old, which wipes the app's data).
#
# The key lives in the `android-release` environment, restricted to the `main` branch like the
# deploy tokens (this repo is PUBLIC and keeps no repo-level secrets):
#   ANDROID_KEYSTORE_BASE64   — the PKCS12 keystore (alias `tbb-release`), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD — its password (store and key share it)
# Losing that keystore means the next APK can't update installed copies — keep a backup.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v5

      # Android SDK is pre-installed on ubuntu-latest runners (ANDROID_HOME is set).

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set in the android-release environment"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tbb-release.p12"
          echo "TBB_KEYSTORE_FILE=$RUNNER_TEMP/tbb-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          TBB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Show signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tbb-release.p12"
